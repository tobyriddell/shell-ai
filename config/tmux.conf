# Enable vi mode (searching in buffers)
setw -g mode-keys vi

# Remap prefix to Ctrl-A
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Allow sending of Ctrl-A to running shell to move to start of line
bind a send-prefix

# Force a reload of the config. file
unbind r
bind r source-file ~/.tmux.conf

# Quick pane cycling
unbind ^A
#bind ^A select-pane -t :.+
bind ^A select-pane -l

# Set terminal for dircolors
set -g default-terminal "screen-256color"

#set -g mouse on
#set -g history-limit 10000

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# AI Integration keybindings (Go Implementation)
# Ctrl-A + A: Create AI input pane (interactive split)
bind A split-window -v -p 25 -c "#{pane_current_path}" "bash -c 'echo -e \"\\033[0;34mAI Input Pane - Type: ai <prompt>, ai-interactive, ai-test, exit\\033[0m\" && bash'"

# Ctrl-A + I: Start interactive AI session with initial question
bind I command-prompt -p "Initial AI Question:" "split-window -v -p 40 -c '#{pane_current_path}' 'shell-ai interactive \"%1\"'"

# Ctrl-A + S: Start interactive AI session (no initial question)
bind S split-window -v -p 40 -c "#{pane_current_path}" "shell-ai interactive"

# Ctrl-A + C: AI copy manager in split pane
bind C split-window -v -p 40 -c "#{pane_current_path}" "bash -c 'source \$HOME/.config/shell-ai/ai-copy.sh && read -p \"Press Enter to close...\"'"

# Ctrl-A + T: Test AI providers in split pane
bind T split-window -v -p 40 -c "#{pane_current_path}" "shell-ai test && read -p \"Press Enter to continue...\""

# Ctrl-A + X: Show AI context in split pane (capture from original pane .0)
bind X split-window -v -p 40 -c "#{pane_current_path}" "bash -c 'tmux capture-pane -t \".0\" -p | shell-ai ask \"Show me the context from this pane:\" && read -p \"Press Enter to continue...\"'"

# Ctrl-A + E: Explain current pane output (capture from original pane .0)
bind E split-window -v -p 40 -c "#{pane_current_path}" "bash -c 'tmux capture-pane -t \".0\" -p | shell-ai ask \"Explain this terminal output:\" && read -p \"Press Enter to continue...\"'"

# Ctrl-A + Q: Quick AI query with prompt (one-shot)
bind Q command-prompt -p "AI Query:" "split-window -v -p 40 -c '#{pane_current_path}' 'shell-ai ask \"%1\" && read -p \"Press Enter to close...\"'"

# Ctrl-A + K: Close current pane (useful for temporary panes)
bind K kill-pane 